<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P0M0D0R0.EXE ★ Y2K Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="panel timer-panel" id="loginScreen" style="max-width: 320px; margin: 5rem auto; padding: 20px; text-align: center;">
  <div class="win-bar">
    <span class="win-title">★ AUTHENTICATION.EXE</span>
  </div>
  <div class="timer-body" style="gap: 12px; margin-top: 15px;">
    <div class="custom-title">✦ PLEASE SIGN IN TO CONTINUE</div>
    <input class="todo-inp" type="email" id="loginEmail" placeholder="EMAIL ADDRESS...">
    <input class="todo-inp" type="password" id="loginPassword" placeholder="PASSWORD...">
    <button class="btn primary" id="signInBtn">SIGN IN / REGISTER</button>
    <div class="stxt" id="authError" style="color: #c04080; margin-top: 5px;"></div>
  </div>
</div>

<div class="wrap" id="mainApp" style="display: none;">
  <!-- TIMER PANEL -->
  <div class="panel timer-panel">
    <div class="win-bar">
      <span class="win-title">★ P0M0D0R0.EXE</span>
      <div class="win-btns">
        <button class="wbtn" onclick="togglePiP()" title="Mini Player">◱</button>
        <div class="wbtn">_</div>
        <div class="wbtn">□</div>
        <div class="wbtn">×</div>
      </div>
    </div>

    <div class="timer-body">
      <div class="mode-tabs">
        <button class="mtab active" onclick="setMode('focus')" id="tab-focus">FOCUS</button>
        <button class="mtab" onclick="setMode('short')" id="tab-short">SHORT</button>
        <button class="mtab" onclick="setMode('long')" id="tab-long">LONG</button>
      </div>

      <div class="clock-ring">
        <svg class="clock-svg" viewBox="0 0 170 170">
          <circle class="ring-bg" cx="85" cy="85" r="72"/>
          <circle class="ring-fill" id="ring" cx="85" cy="85" r="72"
            stroke-dasharray="452.4" stroke-dashoffset="0"/>
        </svg>
        <div class="clock-center">
          <div class="time-disp" id="timeDisp">25:00</div>
          <div class="mode-lbl" id="modeLbl">FOCUS TIME</div>
          <div class="next-lbl" id="nextLbl">NEXT: SHORT BREAK</div>
        </div>
      </div>

      <div class="dots">
        <span class="dot-lbl">SESSIONS:</span>
        <div class="dot" id="d1"></div>
        <div class="dot" id="d2"></div>
        <div class="dot" id="d3"></div>
        <div class="dot" id="d4"></div>
      </div>

      <div class="controls">
        <button class="btn" onclick="handleReset()">RESET</button>
        <button class="btn primary" id="startBtn" onclick="handleStart()">START</button>
        <button class="btn" onclick="handleSkip()">SKIP</button>
      </div>
    </div>

    <canvas id="timerCanvas" width="120" height="120" style="display:none;"></canvas>
    <video id="pipVideo" width="120" height="120" style="display:none;"></video>

    <div class="custom-section">
      <div class="custom-title">✦ CUSTOMIZE TIMES (MIN)</div>
      <div class="custom-grid">
        <div class="custom-item">
          <span class="custom-lbl">FOCUS</span>
          <input class="custom-inp" type="number" id="inp-focus" value="25" min="1" max="120">
        </div>
        <div class="custom-item">
          <span class="custom-lbl">SHORT</span>
          <input class="custom-inp" type="number" id="inp-short" value="5" min="1" max="60">
        </div>
        <div class="custom-item">
          <span class="custom-lbl">LONG</span>
          <input class="custom-inp" type="number" id="inp-long" value="15" min="1" max="90">
        </div>
      </div>
      <button class="apply-btn" onclick="applyCustom()">APPLY CHANGES ★</button>
    </div>

    <div class="audio-hint" id="audioHint">★ CLICK START TO UNLOCK SOUND ★</div>
    <button class="alarm-bar" id="alarmBar" onclick="stopAlarmAndNext()"></button>

    <div class="status-bar">
      <span class="stxt" id="statusTxt">READY</span>
      <span class="stxt">Y2K EDITION</span>
    </div>
  </div>

  <!-- TODO PANEL -->
  <div class="panel todo-panel">
    <div class="win-bar" style="background: var(--blue);">
      <span class="win-title">★ T0D0LIST.EXE</span>
      <div class="win-btns">
        <div class="wbtn">_</div>
        <div class="wbtn">□</div>
        <div class="wbtn">×</div>
      </div>
    </div>

    <div class="todo-body">
      <div class="todo-add">
        <input class="todo-inp" type="text" id="todoInp"
          placeholder="ADD NEW TASK..." maxlength="80"
          onkeydown="if(event.key==='Enter') addTodo(); else if(event.key==='Escape') this.value='';">
        <button class="add-btn" onclick="addTodo()">+ ADD</button>
      </div>
      <div class="todo-list" id="todoList">
        <div class="todo-empty">NO TASKS YET ★<br>ADD ONE ABOVE!</div>
      </div>
      <div class="todo-stats" id="todoStats"></div>
    </div>
  </div>
</div>

<script type="module">
  // Import the configuration and Firebase initialization function
  import { firebaseConfig } from './firebase-config.js';
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

  import { 
    getAuth, 
    signInWithEmailAndPassword, 
    createUserWithEmailAndPassword, 
    onAuthStateChanged 
  } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  if (app) {
    console.log("Firebase successfully initialized!", app.name);
  }

  // 2. Initialize Auth service instance
  const auth = getAuth(app);

  // 3. Monitor user login state dynamically
  onAuthStateChanged(auth, (user) => {
    const loginScreen = document.getElementById('loginScreen');
    const mainApp = document.getElementById('mainApp');

    if (user) {
      // User is signed in -> Hide login box and reveal your Pomodoro dashboard
      loginScreen.style.display = 'none';
      mainApp.style.display = 'flex';
      document.getElementById('statusTxt').textContent = `LOGGED IN AS: ${user.email}`;
    } else {
      // No user signed in -> Keep application interface locked away
      loginScreen.style.display = 'block';
      mainApp.style.display = 'none';
    }
  });

  // 4. Handle button interactions (Attempts login; falls back to registration if account is new)
  document.getElementById('signInBtn').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errorDiv = document.getElementById('authError');
    errorDiv.textContent = ""; // Clear existing log paths

    if (!email || !password) {
      errorDiv.textContent = "⚠️ INPUTS CANNOT BE EMPTY";
      return;
    }

    try {
      // Attempt signing in an existing profile
      await signInWithEmailAndPassword(auth, email, password);
    } catch (loginError) {
      // If user account is not found, attempt creating a fresh profile automatically
      if (loginError.code === 'auth/user-not-found' || loginError.code === 'auth/invalid-credential') {
        try {
          await createUserWithEmailAndPassword(auth, email, password);
        } catch (registerError) {
          errorDiv.textContent = `⚠️ ${registerError.message.replace("Firebase: ", "")}`;
        }
      } else {
        errorDiv.textContent = `⚠️ ${loginError.message.replace("Firebase: ", "")}`;
      }
    }
  });
</script>
<script type="module" src="script.js"></script>
</body>
</html>
