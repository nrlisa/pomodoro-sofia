<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P0M0D0R0.EXE ★ Y2K Edition</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --pink: #f7c5e0; --blue: #b8d8f8; --lavender: #d4c5f9;
  --mint: #b8f0e0; --border: #e8a8d0; --bg: #fdf0f8;
  --surface: #fff5fc; --text: #3a1a5e; --muted: #9a7ab8;
  --dark: #2a1a3e; --mid: #5a3a7e;
}
body {
  background: #fdf0f8;
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 2rem 1rem;
  font-family: 'Orbitron', monospace;
  color: var(--text);
}
.wrap {
  display: flex;
  gap: 12px;
  max-width: 680px;
  width: 100%;
  align-items: flex-start;
}
.panel {
  background: var(--surface);
  border: 2px solid var(--border);
  box-shadow: 3px 3px 0 var(--lavender);
  overflow: hidden;
}
.win-bar {
  background: var(--pink);
  border-bottom: 2px solid var(--border);
  padding: 5px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  user-select: none;
}
.win-title {
  font-family: 'VT323', monospace;
  font-size: 16px;
  color: var(--dark);
  letter-spacing: 2px;
}
.win-btns { display: flex; gap: 4px; }
.wbtn {
  width: 14px; height: 14px;
  border: 1.5px solid var(--mid);
  background: var(--lavender);
  font-family: 'VT323', monospace;
  font-size: 11px; color: var(--mid);
  display: flex; align-items: center; justify-content: center;
}
.timer-panel { width: 280px; flex-shrink: 0; }
.todo-panel { flex: 1; min-width: 0; }
.timer-body {
  padding: 16px 14px;
  display: flex; flex-direction: column;
  align-items: center; gap: 14px;
}
.mode-tabs { display: flex; width: 100%; border: 1.5px solid var(--border); }
.mtab {
  flex: 1; padding: 5px 2px;
  background: transparent; border: none;
  border-right: 1.5px solid var(--border);
  color: var(--muted);
  font-family: 'VT323', monospace;
  font-size: 14px; letter-spacing: 1px;
  cursor: pointer; text-align: center;
}
.mtab:last-child { border-right: none; }
.mtab.active { background: var(--pink); color: var(--dark); }
.mtab:hover:not(.active) { background: #fce8f4; }
.clock-ring { position: relative; width: 170px; height: 170px; }
.clock-svg { width: 170px; height: 170px; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: #f0ddf0; stroke-width: 12; }
.ring-fill {
  fill: none; stroke: #f0a0c8; stroke-width: 12; stroke-linecap: square;
  transition: stroke-dashoffset 1s linear, stroke 0.3s;
}
.ring-fill.short { stroke: #a0c0f8; }
.ring-fill.long  { stroke: #c0a0f8; }
.clock-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
}
.time-disp {
  font-family: 'VT323', monospace;
  font-size: 52px; letter-spacing: 3px;
  color: #d060a0; line-height: 1;
}
.time-disp.short { color: #4080d0; }
.time-disp.long  { color: #8060c0; }
.mode-lbl {
  font-family: 'VT323', monospace;
  font-size: 12px; letter-spacing: 2px; color: var(--muted);
}
.next-lbl {
  font-family: 'VT323', monospace;
  font-size: 11px; letter-spacing: 1px; color: var(--muted); margin-top: 1px;
}
.dots { display: flex; gap: 6px; align-items: center; }
.dot { width: 10px; height: 10px; border: 1.5px solid #d090c0; background: transparent; }
.dot.filled { background: #f0a0c8; }
.dot-lbl {
  font-family: 'VT323', monospace;
  font-size: 12px; color: var(--muted); letter-spacing: 1px; margin-right: 4px;
}
.controls { display: flex; gap: 8px; width: 100%; }
.btn {
  font-family: 'VT323', monospace;
  font-size: 16px; letter-spacing: 1px;
  padding: 7px 12px; flex: 1;
  border: 1.5px solid var(--border);
  background: var(--bg); color: var(--mid);
  cursor: pointer;
  box-shadow: 2px 2px 0 var(--lavender);
  text-align: center;
}
.btn:hover { background: var(--pink); color: var(--dark); }
.btn:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 var(--lavender); }
.btn.primary {
  background: var(--pink); color: var(--dark);
  border-color: #e090c0; flex: 2; font-size: 18px;
}
.btn.primary:hover { background: #f5b0d5; }
.alarm-bar {
  display: none; width: 100%; padding: 9px;
  background: var(--pink); border: none;
  border-top: 2px solid var(--border);
  font-family: 'VT323', monospace;
  font-size: 15px; letter-spacing: 1px;
  color: var(--dark); cursor: pointer; text-align: center;
  animation: ablnk 0.6s steps(1) infinite;
}
.alarm-bar.on { display: block; }
@keyframes ablnk {
  0%,100% { background: var(--pink); }
  50% { background: var(--lavender); }
}
.status-bar {
  background: var(--pink); border-top: 1.5px solid var(--border);
  padding: 3px 8px; display: flex; justify-content: space-between;
}
.stxt {
  font-family: 'VT323', monospace;
  font-size: 12px; color: var(--mid); letter-spacing: 1px;
}
.custom-section {
  width: 100%; border-top: 1.5px dashed var(--border);
  padding: 12px 14px 4px;
}
.custom-title {
  font-family: 'VT323', monospace;
  font-size: 13px; color: var(--muted); letter-spacing: 2px; margin-bottom: 8px;
}
.custom-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 6px; margin-bottom: 10px;
}
.custom-item { display: flex; flex-direction: column; gap: 3px; }
.custom-lbl {
  font-family: 'VT323', monospace;
  font-size: 11px; color: var(--muted); letter-spacing: 1px;
}
.custom-inp {
  font-family: 'VT323', monospace; font-size: 16px;
  width: 100%; padding: 4px 6px;
  border: 1.5px solid var(--border);
  background: var(--bg); color: var(--dark);
  text-align: center; outline: none;
}
.custom-inp:focus { border-color: #c080b0; }
.apply-btn {
  width: 100%; font-family: 'VT323', monospace;
  font-size: 14px; letter-spacing: 2px; padding: 5px;
  border: 1.5px solid var(--border);
  background: var(--lavender); color: var(--dark);
  cursor: pointer; margin-bottom: 12px;
}
.apply-btn:hover { background: var(--pink); }
.audio-hint {
  font-family: 'VT323', monospace;
  font-size: 11px; color: var(--muted);
  text-align: center; letter-spacing: 1px;
  padding: 0 14px 8px;
}
.todo-body { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.todo-add { display: flex; gap: 6px; }
.todo-inp {
  flex: 1; font-family: 'VT323', monospace; font-size: 16px;
  padding: 6px 8px; border: 1.5px solid var(--border);
  background: var(--bg); color: var(--dark);
  outline: none; min-width: 0;
}
.todo-inp:focus { border-color: #c080b0; }
.todo-inp::placeholder { color: var(--muted); }
.add-btn {
  font-family: 'VT323', monospace; font-size: 16px;
  padding: 6px 10px; border: 1.5px solid var(--border);
  background: var(--mint); color: var(--dark);
  cursor: pointer; box-shadow: 2px 2px 0 #90d8c0; white-space: nowrap;
}
.add-btn:hover { background: #90e8c8; }
.todo-list {
  display: flex; flex-direction: column; gap: 5px;
  max-height: 340px; overflow-y: auto;
}
.todo-item {
  display: flex; align-items: center; gap: 7px;
  padding: 7px 8px; border: 1.5px solid var(--border);
  background: var(--bg); cursor: pointer;
}
.todo-item:hover { background: #fce8f8; }
.todo-item.done { opacity: 0.55; }
.todo-check {
  width: 16px; height: 16px; flex-shrink: 0;
  border: 1.5px solid #d090c0; background: transparent;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: #d060a0; font-family: 'VT323', monospace;
}
.todo-item.done .todo-check { background: var(--pink); }
.todo-txt {
  flex: 1; font-family: 'VT323', monospace; font-size: 15px;
  color: var(--text); letter-spacing: 0.5px; word-break: break-word;
}
.todo-item.done .todo-txt { text-decoration: line-through; color: var(--muted); }
.del-btn {
  background: transparent; border: none;
  font-family: 'VT323', monospace; font-size: 15px;
  color: var(--muted); cursor: pointer; padding: 0 2px; flex-shrink: 0;
}
.del-btn:hover { color: #c04080; }
.todo-empty {
  font-family: 'VT323', monospace; font-size: 14px;
  color: var(--muted); text-align: center; padding: 20px; letter-spacing: 1px;
}
.todo-stats {
  font-family: 'VT323', monospace; font-size: 12px;
  color: var(--muted); text-align: right; letter-spacing: 1px;
  border-top: 1px dashed var(--border); padding-top: 6px;
}

/* Responsive */
@media (max-width: 520px) {
  .wrap { flex-direction: column; }
  .timer-panel { width: 100%; }
  .todo-panel { width: 100%; }
}
</style>
</head>
<body>

<div class="wrap">
  <!-- TIMER PANEL -->
  <div class="panel timer-panel">
    <div class="win-bar">
      <span class="win-title">★ P0M0D0R0.EXE</span>
      <div class="win-btns">
        <div class="wbtn">_</div>
        <div class="wbtn">□</div>
        <div class="wbtn">×</div>
      </div>
    </div>

    <div class="timer-body">
      <div class="mode-tabs">
        <button class="mtab active" onclick="setMode('focus')" id="tab-focus">FOCUS</button>
        <button class="mtab" onclick="setMode('short')" id="tab-short">SHORT</button>
        <button class="mtab" onclick="setMode('long')" id="tab-long">LONG</button>
      </div>

      <div class="clock-ring">
        <svg class="clock-svg" viewBox="0 0 170 170">
          <circle class="ring-bg" cx="85" cy="85" r="72"/>
          <circle class="ring-fill" id="ring" cx="85" cy="85" r="72"
            stroke-dasharray="452.4" stroke-dashoffset="0"/>
        </svg>
        <div class="clock-center">
          <div class="time-disp" id="timeDisp">25:00</div>
          <div class="mode-lbl" id="modeLbl">FOCUS TIME</div>
          <div class="next-lbl" id="nextLbl">NEXT: SHORT BREAK</div>
        </div>
      </div>

      <div class="dots">
        <span class="dot-lbl">SESSIONS:</span>
        <div class="dot" id="d1"></div>
        <div class="dot" id="d2"></div>
        <div class="dot" id="d3"></div>
        <div class="dot" id="d4"></div>
      </div>

      <div class="controls">
        <button class="btn" onclick="handleReset()">RESET</button>
        <button class="btn primary" id="startBtn" onclick="handleStart()">START</button>
        <button class="btn" onclick="handleSkip()">SKIP</button>
      </div>
    </div>

    <div class="custom-section">
      <div class="custom-title">✦ CUSTOMIZE TIMES (MIN)</div>
      <div class="custom-grid">
        <div class="custom-item">
          <span class="custom-lbl">FOCUS</span>
          <input class="custom-inp" type="number" id="inp-focus" value="25" min="1" max="120">
        </div>
        <div class="custom-item">
          <span class="custom-lbl">SHORT</span>
          <input class="custom-inp" type="number" id="inp-short" value="5" min="1" max="60">
        </div>
        <div class="custom-item">
          <span class="custom-lbl">LONG</span>
          <input class="custom-inp" type="number" id="inp-long" value="15" min="1" max="90">
        </div>
      </div>
      <button class="apply-btn" onclick="applyCustom()">APPLY CHANGES ★</button>
    </div>

    <div class="audio-hint" id="audioHint">★ CLICK START TO UNLOCK SOUND ★</div>
    <button class="alarm-bar" id="alarmBar" onclick="stopAlarmAndNext()"></button>

    <div class="status-bar">
      <span class="stxt" id="statusTxt">READY</span>
      <span class="stxt">Y2K EDITION</span>
    </div>
  </div>

  <!-- TODO PANEL -->
  <div class="panel todo-panel">
    <div class="win-bar" style="background: var(--blue);">
      <span class="win-title">★ T0D0LIST.EXE</span>
      <div class="win-btns">
        <div class="wbtn">_</div>
        <div class="wbtn">□</div>
        <div class="wbtn">×</div>
      </div>
    </div>

    <div class="todo-body">
      <div class="todo-add">
        <input class="todo-inp" type="text" id="todoInp"
          placeholder="ADD NEW TASK..." maxlength="80"
          onkeydown="if(event.key==='Enter') addTodo()">
        <button class="add-btn" onclick="addTodo()">+ ADD</button>
      </div>
      <div class="todo-list" id="todoList">
        <div class="todo-empty">NO TASKS YET ★<br>ADD ONE ABOVE!</div>
      </div>
      <div class="todo-stats" id="todoStats"></div>
    </div>
  </div>
</div>

<script>
  const CIRC = 452.4;
  let CFG = { focus: 25, short: 5, long: 15 };
  let mode = 'focus';
  let totalSecs = CFG.focus * 60;
  let secsLeft = totalSecs;
  let running = false;
  let iv = null;
  let sessions = 0;
  let alarmIv = null;
  let alarmNodes = [];
  let todos = [];
  let todoId = 0;
  let pendingNextMode = null;
  let audioCtx = null;
  let audioUnlocked = false;

  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    if (!audioUnlocked) {
      const buf = audioCtx.createBuffer(1, 1, 22050);
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(audioCtx.destination);
      src.start(0);
      audioUnlocked = true;
      const hint = document.getElementById('audioHint');
      hint.textContent = '★ SOUND UNLOCKED ★';
      setTimeout(() => { hint.style.display = 'none'; }, 1500);
    }
  }

  function playLoop() {
    stopSound();
    function beep() {
      if (!audioCtx) return;
      const freqs = [523, 659, 784, 659];
      freqs.forEach((f, i) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g);
        g.connect(audioCtx.destination);
        o.type = 'square';
        o.frequency.value = f;
        const t = audioCtx.currentTime + i * 0.18;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.12, t + 0.02);
        g.gain.linearRampToValueAtTime(0, t + 0.16);
        o.start(t);
        o.stop(t + 0.2);
        alarmNodes.push(o);
      });
    }
    beep();
    alarmIv = setInterval(beep, 900);
  }

  function stopSound() {
    if (alarmIv) { clearInterval(alarmIv); alarmIv = null; }
    alarmNodes.forEach(n => { try { n.stop(); } catch(e){} });
    alarmNodes = [];
  }

  function getNextMode(m) {
    if (m === 'focus') return (sessions > 0 && sessions % 4 === 0) ? 'long' : 'short';
    return 'focus';
  }

  const modeColors = { focus: '', short: 'short', long: 'long' };
  const modeLabels = { focus: 'FOCUS TIME', short: 'SHORT BREAK', long: 'LONG BREAK' };

  function setMode(m, autoStart) {
    if (running && !autoStart) return;
    clearInterval(iv); running = false;
    mode = m;
    totalSecs = CFG[m] * 60;
    secsLeft = totalSecs;
    document.querySelectorAll('.mtab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + m).classList.add('active');
    document.getElementById('timeDisp').className = 'time-disp ' + modeColors[m];
    document.getElementById('ring').className = 'ring-fill ' + modeColors[m];
    document.getElementById('modeLbl').textContent = modeLabels[m];
    document.getElementById('nextLbl').textContent = 'NEXT: ' + modeLabels[getNextMode(m)];
    document.getElementById('startBtn').textContent = 'START';
    updateDisp(); updateRing();
    if (autoStart) {
      document.getElementById('statusTxt').textContent = 'AUTO-STARTING...';
      setTimeout(startTimer, 400);
    }
  }

  function applyCustom() {
    if (running) return;
    CFG.focus = Math.min(120, Math.max(1, parseInt(document.getElementById('inp-focus').value) || 25));
    CFG.short = Math.min(60,  Math.max(1, parseInt(document.getElementById('inp-short').value) || 5));
    CFG.long  = Math.min(90,  Math.max(1, parseInt(document.getElementById('inp-long').value)  || 15));
    document.getElementById('inp-focus').value = CFG.focus;
    document.getElementById('inp-short').value = CFG.short;
    document.getElementById('inp-long').value  = CFG.long;
    totalSecs = CFG[mode] * 60;
    secsLeft = totalSecs;
    updateDisp(); updateRing();
    document.getElementById('statusTxt').textContent = 'TIMES UPDATED!';
  }

  function updateDisp() {
    const m = String(Math.floor(secsLeft / 60)).padStart(2, '0');
    const s = String(secsLeft % 60).padStart(2, '0');
    document.getElementById('timeDisp').textContent = m + ':' + s;
  }

  function updateRing() {
    document.getElementById('ring').style.strokeDashoffset = CIRC * (1 - secsLeft / totalSecs);
  }

  function startTimer() {
    running = true;
    document.getElementById('startBtn').textContent = 'PAUSE';
    document.getElementById('statusTxt').textContent = 'RUNNING...';
    iv = setInterval(() => {
      if (secsLeft <= 0) {
        clearInterval(iv); running = false;
        document.getElementById('startBtn').textContent = 'START';
        onEnd(); return;
      }
      secsLeft--; updateDisp(); updateRing();
    }, 1000);
  }

  function handleStart() {
    ensureAudio();
    if (running) {
      clearInterval(iv); running = false;
      document.getElementById('startBtn').textContent = 'START';
      document.getElementById('statusTxt').textContent = 'PAUSED';
    } else {
      startTimer();
    }
  }

  function onEnd() {
    if (mode === 'focus') { sessions = Math.min(sessions + 1, 4); updateDots(); }
    pendingNextMode = getNextMode(mode);
    document.getElementById('alarmBar').textContent =
      '★ ' + modeLabels[mode] + ' DONE! CLICK → START ' + modeLabels[pendingNextMode] + ' ★';
    document.getElementById('alarmBar').classList.add('on');
    playLoop();
    document.getElementById('statusTxt').textContent = '★ CLICK BANNER TO CONTINUE ★';
  }

  function stopAlarmAndNext() {
    stopSound();
    document.getElementById('alarmBar').classList.remove('on');
    const next = pendingNextMode || 'focus';
    pendingNextMode = null;
    setMode(next, true);
  }

  function handleReset() {
    ensureAudio();
    clearInterval(iv); stopSound(); running = false;
    document.getElementById('startBtn').textContent = 'START';
    document.getElementById('alarmBar').classList.remove('on');
    pendingNextMode = null;
    secsLeft = totalSecs; updateDisp(); updateRing();
    document.getElementById('statusTxt').textContent = 'READY';
  }

  function handleSkip() {
    ensureAudio();
    clearInterval(iv); stopSound(); running = false;
    document.getElementById('startBtn').textContent = 'START';
    document.getElementById('alarmBar').classList.remove('on');
    if (mode === 'focus') { sessions = Math.min(sessions + 1, 4); updateDots(); }
    const next = getNextMode(mode);
    pendingNextMode = null;
    setMode(next, true);
  }

  function updateDots() {
    for (let i = 1; i <= 4; i++)
      document.getElementById('d' + i).classList.toggle('filled', i <= sessions);
    if (sessions >= 4) {
      sessions = 0;
      setTimeout(() => {
        for (let i = 1; i <= 4; i++) document.getElementById('d' + i).classList.remove('filled');
      }, 3000);
    }
    document.getElementById('nextLbl').textContent = 'NEXT: ' + modeLabels[getNextMode(mode)];
  }

  function addTodo() {
    const inp = document.getElementById('todoInp');
    const txt = inp.value.trim();
    if (!txt) return;
    todos.push({ id: todoId++, txt, done: false });
    inp.value = '';
    renderTodos();
  }

  function toggleTodo(id) {
    const t = todos.find(x => x.id === id);
    if (t) { t.done = !t.done; renderTodos(); }
  }

  function deleteTodo(id) {
    todos = todos.filter(x => x.id !== id);
    renderTodos();
  }

  function renderTodos() {
    const list = document.getElementById('todoList');
    const stats = document.getElementById('todoStats');
    if (todos.length === 0) {
      list.innerHTML = '<div class="todo-empty">NO TASKS YET ★<br>ADD ONE ABOVE!</div>';
      stats.textContent = ''; return;
    }
    list.innerHTML = '';
    todos.forEach(t => {
      const item = document.createElement('div');
      item.className = 'todo-item' + (t.done ? ' done' : '');
      item.onclick = () => toggleTodo(t.id);
      item.innerHTML =
        '<div class="todo-check">' + (t.done ? '✓' : '') + '</div>' +
        '<div class="todo-txt">' + t.txt.replace(/</g, '&lt;') + '</div>' +
        '<button class="del-btn" onclick="event.stopPropagation();deleteTodo(' + t.id + ')">✕</button>';
      list.appendChild(item);
    });
    const done = todos.filter(x => x.done).length;
    stats.textContent = done + '/' + todos.length + ' DONE ★';
  }

  updateDisp();
  updateRing();
</script>
</body>
</html>
